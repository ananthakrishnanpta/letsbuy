spring:
  application:
    name: letsbuy
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/letsbuy}
    username: ${DATABASE_USERNAME:letsbuy}
    password: ${DATABASE_PASSWORD:letsbuy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: letsbuy
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    secret: ${JWT_SECRET}
  auth:
    require-email-verification: true
    cookie-secure: true
    log-email-tokens: false
    max-failed-logins: 5
    lock-duration: 15m
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: []
  seed:
    enabled: false
    admin-email: ${APP_ADMIN_EMAIL:}
    admin-password: ${APP_ADMIN_PASSWORD:}
    catalog: false
