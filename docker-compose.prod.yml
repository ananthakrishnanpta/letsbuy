services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: letsbuy
      POSTGRES_USER: letsbuy
      POSTGRES_PASSWORD: letsbuy
    volumes:
      - letsbuy-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letsbuy -d letsbuy"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/letsbuy
      DATABASE_USERNAME: letsbuy
      DATABASE_PASSWORD: letsbuy
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  letsbuy-pg:
